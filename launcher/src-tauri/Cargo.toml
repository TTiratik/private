[package]
name = "classic5rp-launcher"
version = "0.1.0"
edition = "2021"
description = "Classic 5 RP — game launcher"
default-run = "classic5rp-launcher"

[lib]
name = "classic5rp_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
classic5rp-core = { path = "core" }

[workspace]
members = ["core"]
